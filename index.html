
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latin Square 6 Solver</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: system-ui, sans-serif;
  background: #f1f5f9;
  color: #243b53;
  padding: 12px;
}

main { max-width: 550px; margin: auto; }

h1 { text-align: center; }

.panel {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin: 12px 0;
}

.symbols {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.symbols input {
  width: 40px;
  height: 40px;
  text-align: center;
  font-size: 20px;
}

.board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  border: 2px solid #243b53;
}

.cell {
  aspect-ratio: 1;
  position: relative;
  border-right: 1px solid #b9c8d4;
  border-bottom: 1px solid #b9c8d4;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.cell:nth-child(6n) { border-right: 0; }
.cell:nth-last-child(-n+6) { border-bottom: 0; }

.cell.selected { background: #dbeafe; }

.cell.invalid { background: #ffe0df; }

.value {
  font-size: clamp(20px, 5vw, 30px);
  font-weight: bold;
  z-index: 2;
}

.candidates {
  position: absolute;
  inset: 2px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  justify-items: center;
  align-items: center;
  font-size: clamp(8px, 2vw, 11px);
  color: #8293a3;
  pointer-events: none;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}

button {
  padding: 10px 14px;
  border: 0;
  border-radius: 8px;
  background: #243b53;
  color: white;
  font-size: 15px;
}

.secondary {
  background: #e2e8f0;
  color: #243b53;
}

#status {
  text-align: center;
  margin-top: 12px;
  font-weight: bold;
}

#keyboardInput {
  position: fixed;
  left: -100px;
  top: 0;
  width: 1px;
  height: 1px;
  opacity: 0.01;
}

</style>
</head>

<body>

<main>

<h1>Latin Square 6 Solver</h1>

<p style="text-align:center">
Click a square, then type a letter.
</p>

<div class="panel">
  <p style="text-align:center">Your six symbols</p>
  <div class="symbols" id="symbols"></div>
</div>

<div class="panel">

  <div class="board" id="board"></div>

  <div class="buttons">
    <button onclick="clearGrid()">Clear grid</button>
    <button class="secondary" onclick="undo()">Undo</button>
    <button class="secondary" onclick="checkGrid()">Check</button>
  </div>

  <div id="status">Ready</div>

</div>

</main>

<input id="keyboardInput"
       type="text"
       autocomplete="off"
       autocapitalize="characters">

<script>

const SIZE = 6;

let symbols = ["A","B","C","D","E","F"];

let grid = Array.from(
  {length: 6},
  () => Array(6).fill("")
);

let selectedRow = 0;
let selectedCol = 0;

let history = [];

const board = document.getElementById("board");
const keyboard = document.getElementById("keyboardInput");

function saveHistory() {
  history.push({
    grid: grid.map(row => [...row]),
    symbols: [...symbols]
  });
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function used(row, col) {
  let result = new Set();

  for (let i = 0; i < 6; i++) {
    if (grid[row][i]) result.add(grid[row][i]);
    if (grid[i][col]) result.add(grid[i][col]);
  }

  return result;
}

function candidates(row, col) {
  if (grid[row][col]) return [];

  let taken = used(row, col);

  return symbols.filter(s => !taken.has(s));
}

function conflict(row, col) {
  let v = grid[row][col];

  if (!v) return false;

  return (
    grid[row].filter(x => x === v).length > 1 ||
    grid.map(r => r[col]).filter(x => x === v).length > 1
  );
}

function renderSymbols() {
  const container = document.getElementById("symbols");
  container.innerHTML = "";

  symbols.forEach((symbol, index) => {
    let input = document.createElement("input");
    input.value = symbol;
    input.maxLength = 1;

    input.addEventListener("change", () => {
      let value = input.value.toUpperCase().trim();

      if (
        value.length !== 1 ||
        symbols.some((s, i) => i !== index && s === value)
      ) {
        input.value = symbols[index];
        setStatus("Use six different symbols.");
        return;
      }

      saveHistory();

      let old = symbols[index];
      symbols[index] = value;

      grid = grid.map(row =>
        row.map(cell => cell === old ? value : cell)
      );

      render();
      setStatus("Symbols updated.");
    });

    container.appendChild(input);
  });
}

function render() {
  board.innerHTML = "";

  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 6; col++) {

      let cell = document.createElement("div");
      cell.className = "cell";

      if (row === selectedRow && col === selectedCol) {
        cell.classList.add("selected");
      }

      if (conflict(row, col)) {
        cell.classList.add("invalid");
      }

      let value = document.createElement("div");
      value.className = "value";
      value.textContent = grid[row][col];

      cell.appendChild(value);

      let possible = document.createElement("div");
      possible.className = "candidates";

      candidates(row, col).forEach(symbol => {
        let span = document.createElement("span");
        span.textContent = symbol;
        possible.appendChild(span);
      });

      cell.appendChild(possible);

      cell.addEventListener("click", () => {
        selectedRow = row;
        selectedCol = col;

        render();

        // Focus the single hidden keyboard input.
        keyboard.focus();
      });

      board.appendChild(cell);
    }
  }
}

keyboard.addEventListener("input", () => {

  let value = keyboard.value.toUpperCase().trim();

  // Clear the input so it is ready for the next key.
  keyboard.value = "";

  if (!value) return;

  if (symbols.includes(value)) {

    saveHistory();

    grid[selectedRow][selectedCol] = value;

    render();

    setStatus(
      conflict(selectedRow, selectedCol)
      ? "Duplicate in row or column!"
      : "Letter entered."
    );

  } else {

    setStatus("Please enter one of your six symbols.");

  }

});

keyboard.addEventListener("keydown", event => {

  let row = selectedRow;
  let col = selectedCol;

  if (event.key === "ArrowRight") col = Math.min(5, col + 1);
  else if (event.key === "ArrowLeft") col = Math.max(0, col - 1);
  else if (event.key === "ArrowDown") row = Math.min(5, row + 1);
  else if (event.key === "ArrowUp") row = Math.max(0, row - 1);

  else if (event.key === "Backspace" || event.key === "Delete") {

    event.preventDefault();

    saveHistory();

    grid[selectedRow][selectedCol] = "";

    render();

    keyboard.focus();

    setStatus("Square cleared.");

    return;
  }

  if (row !== selectedRow || col !== selectedCol) {

    event.preventDefault();

    selectedRow = row;
    selectedCol = col;

    render();

    keyboard.focus();
  }

});

function clearGrid() {

  saveHistory();

  grid = Array.from(
    {length: 6},
    () => Array(6).fill("")
  );

  render();

  keyboard.focus();

  setStatus("Grid cleared.");

}

function undo() {

  if (!history.length) {
    setStatus("Nothing to undo.");
    return;
  }

  let previous = history.pop();

  grid = previous.grid;
  symbols = previous.symbols;

  renderSymbols();
  render();

  keyboard.focus();

  setStatus("Undo complete.");

}

function checkGrid() {

  let filled = 0;
  let errors = 0;

  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 6; col++) {

      if (grid[row][col]) filled++;

      if (conflict(row, col)) errors++;

    }
  }

  if (errors) {
    setStatus("Conflicts detected.");
  }
  else if (filled === 36) {
    setStatus("Complete and valid Latin square!");
  }
  else {
    setStatus(`No conflicts. ${filled}/36 cells filled.`);
  }

}

renderSymbols();
render();

</script>

</body>
</html>
