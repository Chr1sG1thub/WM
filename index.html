
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#243b53">
<title>Latin Square 6 Solver</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: system-ui, sans-serif;
  background: #f1f5f9;
  color: #243b53;
  margin: 0;
  padding: 16px;
}

main {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 1.6rem;
}

p {
  text-align: center;
  color: #607487;
}

.panel {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin: 14px 0;
}

.symbols {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.symbols input {
  width: 40px;
  height: 42px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  border: 1px solid #b9c8d4;
  border-radius: 6px;
}

.board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  border: 2px solid #243b53;
}

.cell {
  aspect-ratio: 1;
  position: relative;
  border-right: 1px solid #b9c8d4;
  border-bottom: 1px solid #b9c8d4;
}

.cell:nth-child(6n) {
  border-right: 0;
}

.cell:nth-last-child(-n+6) {
  border-bottom: 0;
}

.cell input {
  width: 100%;
  height: 100%;
  border: 0;
  outline: none;
  background: transparent;
  text-align: center;
  font-size: clamp(20px, 5vw, 30px);
  font-weight: bold;
  color: #243b53;
  text-transform: uppercase;
  padding: 0;
  position: relative;
  z-index: 2;
}

.cell input:focus {
  background: #e0f2fe;
}

.candidates {
  position: absolute;
  inset: 2px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  align-items: center;
  justify-items: center;
  color: #8293a3;
  font-size: clamp(8px, 2vw, 11px);
  pointer-events: none;
}

.cell input:placeholder-shown {
  font-size: 0;
}

.cell.invalid {
  background: #ffe0df;
}

.cell.invalid input {
  color: #b91c1c;
}

.buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 14px;
}

button {
  padding: 10px 14px;
  border: 0;
  border-radius: 8px;
  background: #243b53;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button.secondary {
  background: #e2e8f0;
  color: #243b53;
}

#status {
  text-align: center;
  font-weight: bold;
  margin-top: 14px;
  min-height: 24px;
}

</style>
</head>

<body>

<main>

<h1>Latin Square 6 Solver</h1>

<p>Enter letters in the grid to see the remaining possibilities.</p>

<div class="panel">
  <p>Choose your six symbols:</p>
  <div class="symbols" id="symbols"></div>
</div>

<div class="panel">

  <div class="board" id="board"></div>

  <div class="buttons">
    <button onclick="clearGrid()">Clear grid</button>
    <button class="secondary" onclick="undo()">Undo</button>
    <button class="secondary" onclick="checkGrid()">Check square</button>
  </div>

  <div id="status">Ready</div>

</div>

<p>
Each symbol must appear once in every row and column.
</p>

</main>

<script>

const SIZE = 6;

let symbols = ["A","B","C","D","E","F"];

let grid = Array.from(
  {length: SIZE},
  () => Array(SIZE).fill("")
);

let history = [];

function saveHistory() {
  history.push({
    grid: grid.map(row => [...row]),
    symbols: [...symbols]
  });
}

function getUsed(row, col) {

  let used = new Set();

  for (let i = 0; i < SIZE; i++) {
    if (grid[row][i]) used.add(grid[row][i]);
    if (grid[i][col]) used.add(grid[i][col]);
  }

  return used;
}

function getCandidates(row, col) {

  if (grid[row][col]) return [];

  let used = getUsed(row, col);

  return symbols.filter(s => !used.has(s));
}

function hasConflict(row, col) {

  let value = grid[row][col];

  if (!value) return false;

  return (
    grid[row].filter(v => v === value).length > 1 ||
    grid.map(r => r[col]).filter(v => v === value).length > 1
  );
}

function renderSymbols() {

  const container = document.getElementById("symbols");

  container.innerHTML = "";

  symbols.forEach((symbol, index) => {

    let input = document.createElement("input");

    input.value = symbol;
    input.maxLength = 1;

    input.addEventListener("change", () => {

      let value = input.value.toUpperCase().trim();

      if (
        value.length !== 1 ||
        symbols.some((s, i) => i !== index && s === value)
      ) {
        input.value = symbols[index];
        setStatus("Please use six different symbols.");
        return;
      }

      saveHistory();

      let old = symbols[index];

      symbols[index] = value;

      grid = grid.map(row =>
        row.map(cell => cell === old ? value : cell)
      );

      render();

      setStatus("Symbols updated.");

    });

    container.appendChild(input);

  });
}

function render() {

  const board = document.getElementById("board");

  board.innerHTML = "";

  for (let row = 0; row < SIZE; row++) {

    for (let col = 0; col < SIZE; col++) {

      let cell = document.createElement("div");

      cell.className = "cell";

      if (hasConflict(row, col)) {
        cell.classList.add("invalid");
      }

      let input = document.createElement("input");

      input.value = grid[row][col];
      input.placeholder = " ";
      input.maxLength = 1;
      input.autocomplete = "off";

      input.setAttribute(
        "aria-label",
        `Row ${row+1}, column ${col+1}`
      );

      input.addEventListener("input", () => {

        let value = input.value.toUpperCase().trim();

        if (value && !symbols.includes(value)) {
          input.value = grid[row][col];
          setStatus("Please enter one of the six symbols.");
          return;
        }

        saveHistory();

        grid[row][col] = value;

        render();

        // Keep focus on the same square after updating.
        const nextInput =
          board.children[row * SIZE + col].querySelector("input");

        nextInput.focus();

        setStatus(
          hasConflict(row, col)
          ? "Duplicate in row or column!"
          : "Possibilities updated."
        );

      });

      input.addEventListener("keydown", event => {

        let r = row;
        let c = col;

        if (event.key === "ArrowRight") c = Math.min(5, col + 1);
        else if (event.key === "ArrowLeft") c = Math.max(0, col - 1);
        else if (event.key === "ArrowDown") r = Math.min(5, row + 1);
        else if (event.key === "ArrowUp") r = Math.max(0, row - 1);

        else if (event.key === "Backspace" || event.key === "Delete") {

          if (grid[row][col]) {

            event.preventDefault();

            saveHistory();

            grid[row][col] = "";

            render();

            board.children[row * SIZE + col]
              .querySelector("input").focus();

            setStatus("Square cleared.");
          }

          return;
        }

        if (r !== row || c !== col) {

          event.preventDefault();

          board.children[r * SIZE + c]
            .querySelector("input").focus();

        }

      });

      cell.appendChild(input);

      let candidates = document.createElement("div");

      candidates.className = "candidates";

      getCandidates(row, col).forEach(symbol => {

        let span = document.createElement("span");

        span.textContent = symbol;

        candidates.appendChild(span);

      });

      cell.appendChild(candidates);

      board.appendChild(cell);

    }

  }

}

function clearGrid() {

  saveHistory();

  grid = Array.from(
    {length: SIZE},
    () => Array(SIZE).fill("")
  );

  render();

  setStatus("Grid cleared.");

}

function undo() {

  if (history.length === 0) {
    setStatus("Nothing to undo.");
    return;
  }

  let previous = history.pop();

  grid = previous.grid;
  symbols = previous.symbols;

  renderSymbols();
  render();

  setStatus("Undo complete.");

}

function checkGrid() {

  let filled = 0;
  let conflicts = 0;

  for (let row = 0; row < SIZE; row++) {

    for (let col = 0; col < SIZE; col++) {

      if (grid[row][col]) filled++;

      if (hasConflict(row, col)) conflicts++;

    }

  }

  if (conflicts) {

    setStatus("There are conflicting letters.");

  } else if (filled === 36) {

    setStatus("Complete and valid Latin square!");

  } else {

    setStatus(
      `No conflicts. ${filled}/36 squares filled.`
    );

  }

}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

renderSymbols();
render();

</script>

</body>
</html>
